spring:
  application:
    name: commentary-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      auto-index-creation: true
      uuid-representation: standard
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: dev.cricklive.commentary.dto.BallEventMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.cricklive.commentary.dto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cricklive:
  security:
    jwt-secret: ${JWT_SECRET:}
  kafka:
    topics:
      ball-events: ball-events

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
  level:
    dev.cricklive: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://${MONGO_USERNAME:cricklive}:${MONGO_PASSWORD:cricklive_secret}@localhost:27017/cricklive?authSource=admin}
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:cricklive_secret}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: commentary-service-group
      auto-offset-reset: earliest

cricklive:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}

logging:
  level:
    dev.cricklive: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST:mongo}:27017/${MONGO_DB:cricklive}?authSource=admin
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: commentary-service-group
      auto-offset-reset: earliest
