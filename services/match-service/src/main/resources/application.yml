spring:
  application:
    name: match-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  kafka:
    consumer:
      group-id: match-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: dev.cricklive.match.dto.BallEventMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.cricklive.match.dto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
  level:
    dev.cricklive: INFO
    org.springframework.security: WARN

eureka:
  client:
    enabled: false

cricklive:
  security:
    jwt-secret: ${JWT_SECRET:}
  kafka:
    topics:
      ball-events: ball-events
      match-state-changes: match-state-changes
  cache:
    scorecard-ttl-seconds: 300
    live-matches-ttl-seconds: 30

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/cricklive}
    username: ${POSTGRES_USER:cricklive}
    password: ${POSTGRES_PASSWORD:cricklive_secret}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:cricklive_secret}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

  flyway:
    locations: classpath:db/migration,classpath:db/dev

cricklive:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}

logging:
  level:
    dev.cricklive: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:cricklive}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

  flyway:
    locations: classpath:db/migration,classpath:db/dev

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256

management:
  tracing:
    sampling:
      probability: 0.05
