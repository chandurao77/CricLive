# Serves the SPA and routes API/WebSocket traffic to the services,
# mirroring the dev proxy in vite.config.ts.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/matches   { proxy_pass http://match-service:8082; }
  location /api/v1/score     { proxy_pass http://scoring-service:8083; }
  location /api/v1/commentary { proxy_pass http://commentary-service:8084; }

  location /ws {
    proxy_pass http://commentary-service:8084;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / { try_files $uri /index.html; }
}
