name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/cricklive

jobs:
  # ── Backend: match-service ─────────────────────────────────────
  match-service:
    name: match-service (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/match-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & unit test
        run: mvn -B verify -Dmaven.test.failure.ignore=false

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-service-test-report
          path: services/match-service/target/surefire-reports/

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}/match-service:${{ github.sha }} .
          docker tag ${{ env.IMAGE_PREFIX }}/match-service:${{ github.sha }} \
                     ${{ env.IMAGE_PREFIX }}/match-service:latest

      - name: Container scan (Trivy)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/match-service:${{ github.sha }}
          format: sarif
          output: trivy-match-service.sarif
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE_PREFIX }}/match-service:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/match-service:latest

  # ── Backend: scoring-service ───────────────────────────────────
  scoring-service:
    name: scoring-service (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scoring-service

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - run: mvn -B verify -Dmaven.test.failure.ignore=false
      - name: Build & push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}/scoring-service:${{ github.sha }} .
        env:
          DOCKER_BUILDKIT: 1

  # ── Backend: commentary-service ────────────────────────────────
  commentary-service:
    name: commentary-service (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commentary-service

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - run: mvn -B verify -Dmaven.test.failure.ignore=false

  # ── Frontend: web ──────────────────────────────────────────────
  frontend-web:
    name: frontend/web (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ── CodeQL SAST ────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: [java, javascript]

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      # The services are independent Maven projects, so autobuild at the repo root finds nothing.
      - name: Build Java services
        if: matrix.language == 'java'
        run: |
          for svc in match-service scoring-service commentary-service; do
            mvn -B -q -f services/$svc/pom.xml package -DskipTests
          done
      - uses: github/codeql-action/analyze@v3
