# ─────────────────────────────────────────────
#  CrickLive — Local Development Infrastructure
# ─────────────────────────────────────────────

networks:
  cricklive-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  es_data:
  zookeeper_data:
  kafka_data:
  pgadmin_data:
  minio_data:

services:

  # ── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cricklive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cricklive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricklive_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cricklive}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cricklive-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cricklive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin ──────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    profiles: [tools]
    container_name: cricklive-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cricklive.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cricklive-net

  # ── MongoDB ──────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: cricklive-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-cricklive}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cricklive_secret}
      MONGO_INITDB_DATABASE: cricklive
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cricklive-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: cricklive-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-cricklive_secret}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cricklive-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-cricklive_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (for Kafka) ─────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: cricklive-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - cricklive-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: cricklive-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cricklive-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka UI ──────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [tools]
    container_name: cricklive-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8090:8080"
    networks:
      - cricklive-net

  # ── Elasticsearch ─────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: [tools]
    container_name: cricklive-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=cricklive-cluster
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - cricklive-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kibana ────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    profiles: [tools]
    container_name: cricklive-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - cricklive-net

  # ── MinIO (S3-compatible object storage) ──────
  minio:
    image: minio/minio:latest
    profiles: [tools]
    container_name: cricklive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cricklive}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cricklive_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - cricklive-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services ──────────────────────
  match-service:
    build: ../../services/match-service
    container_name: cricklive-match-service
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-cricklive}
      POSTGRES_USER: ${POSTGRES_USER:-cricklive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricklive_secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cricklive_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes) in .env}
    ports:
      - "8082:8082"
    networks:
      - cricklive-net

  scoring-service:
    build: ../../services/scoring-service
    container_name: cricklive-scoring-service
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_HOST: mongo
      MONGO_USERNAME: ${MONGO_USERNAME:-cricklive}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-cricklive_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes) in .env}
    ports:
      - "8083:8083"
    networks:
      - cricklive-net

  commentary-service:
    build: ../../services/commentary-service
    container_name: cricklive-commentary-service
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_HOST: mongo
      MONGO_USERNAME: ${MONGO_USERNAME:-cricklive}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-cricklive_secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cricklive_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 bytes) in .env}
    ports:
      - "8084:8084"
    networks:
      - cricklive-net

  web:
    build: ../../frontend/web
    container_name: cricklive-web
    restart: unless-stopped
    depends_on:
      - match-service
      - scoring-service
      - commentary-service
    ports:
      - "8080:80"
    networks:
      - cricklive-net
